<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Gidi Dash</title>
    <meta name="description" content="A free one-tap running game on Nigerian streets." />
    <meta name="theme-color" content="#0e7a3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gidi Dash" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #0f1a12;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: var(--bg);
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        font-family: 'Trebuchet MS', Verdana, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
      }
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: max(24px, var(--safe-top)) max(24px, var(--safe-right)) max(24px, var(--safe-bottom)) max(24px, var(--safe-left));
        background: var(--bg);
        color: #fff;
        font-size: 1.2rem;
        text-align: center;
        z-index: 20;
      }
      /* Only during a run: the menus work upright too. Play is sideways only, on any screen size. */
      @media (orientation: portrait) {
        body.playing #rotate {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Gidi Dash game. Tap anywhere to jump."></canvas>
    <div id="rotate" role="status">Turn your phone sideways to play.</div>
    <noscript><p style="color:#fff;padding:16px">Gidi Dash needs JavaScript turned on to play.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
